<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mostakim image to video </title>
</head>
<body>
    
<div class="kling-container">
  <div class="kling-header">
    <h1>Image to Video Generator</h1>
    <p>Transform your images into stunning videos with AI</p>
  </div>
  
  <div class="kling-main">
    <div class="kling-mode-selector">
      <button class="kling-mode-btn active" data-mode="image-to-video">Image to Video</button>
      <button class="kling-mode-btn" data-mode="text-to-video">Text to Video</button>
    </div>
    
    <div class="kling-upload-section">
      <div class="kling-upload-box" id="uploadBox">
        <div class="kling-upload-content">
          <svg class="kling-upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 10V9C7 6.23858 9.23858 4 12 4C14.7614 4 17 6.23858 17 9V10C19.2091 10 21 11.7909 21 14C21 15.4806 20.1956 16.8084 19 17.5M7 10C4.79086 10 3 11.7909 3 14C3 15.4806 3.8044 16.8084 5 17.5M7 10C7.43285 10 7.84965 10.0688 8.24006 10.1959M12 12V21M12 12L15 15M12 12L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h3>Upload Image</h3>
          <p>Drag & drop your image here or click to browse</p>
          <input type="file" id="imageUpload" accept="image/*" style="display: none;">
          <button class="kling-upload-btn" id="uploadBtn">Select Image</button>
        </div>
      </div>
      
      <div class="kling-preview-box" id="previewBox" style="display: none;">
        <img id="imagePreview" src="" alt="Preview">
        <div class="kling-preview-overlay">
          <button class="kling-change-btn" id="changeImageBtn">Change Image</button>
        </div>
      </div>
    </div>
    
    <div class="kling-settings">
      <div class="kling-setting-group">
        <label for="videoStyle">Video Style</label>
        <select id="videoStyle">
          <option value="realistic">Realistic</option>
          <option value="animated">Animated</option>
          <option value="cartoon">Cartoon</option>
          <option value="cinematic">Cinematic</option>
        </select>
      </div>
      
      <div class="kling-setting-group">
        <label for="videoLength">Video Length (seconds)</label>
        <input type="range" id="videoLength" min="1" max="30" value="5">
        <span id="lengthValue">5s</span>
      </div>
      
      <div class="kling-setting-group" id="promptGroup">
        <label for="videoPrompt">Prompt (optional)</label>
        <textarea id="videoPrompt" placeholder="Describe what you want to see in the video..."></textarea>
      </div>
    </div>
    
    <div class="kling-action-btns">
      <button class="kling-generate-btn" id="generateBtn">Generate Video</button>
    </div>
  </div>
  
  <div class="kling-results" id="resultsSection" style="display: none;">
    <h3>Generated Videos</h3>
    <div class="kling-video-grid" id="videoGrid">
      <!-- Videos will appear here -->
    </div>
  </div>
</div>

<style>
.kling-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  font-family: 'Inter', sans-serif;
  color: #333;
}

.kling-header {
  text-align: center;
  margin-bottom: 40px;
}

.kling-header h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
  color: #111;
}

.kling-header p {
  font-size: 1.1rem;
  color: #666;
}

.kling-mode-selector {
  display: flex;
  justify-content: center;
  margin-bottom: 30px;
  gap: 15px;
}

.kling-mode-btn {
  padding: 10px 25px;
  border: none;
  border-radius: 8px;
  background: #f0f0f0;
  color: #555;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.kling-mode-btn.active {
  background: #6d28d9;
  color: white;
}

.kling-upload-section {
  margin-bottom: 30px;
}

.kling-upload-box {
  border: 2px dashed #ccc;
  border-radius: 12px;
  padding: 40px;
  text-align: center;
  background: #f9f9f9;
  transition: all 0.3s ease;
}

.kling-upload-box:hover {
  border-color: #6d28d9;
  background: #f5f0ff;
}

.kling-upload-content {
  max-width: 500px;
  margin: 0 auto;
}

.kling-upload-icon {
  width: 60px;
  height: 60px;
  margin-bottom: 20px;
  color: #6d28d9;
}

.kling-upload-box h3 {
  font-size: 1.5rem;
  margin-bottom: 10px;
}

.kling-upload-box p {
  color: #666;
  margin-bottom: 20px;
}

.kling-upload-btn {
  background: #6d28d9;
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.kling-upload-btn:hover {
  background: #5b21b6;
}

.kling-preview-box {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  max-width: 600px;
  margin: 0 auto;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.kling-preview-box img {
  width: 100%;
  display: block;
}

.kling-preview-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 20px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  display: flex;
  justify-content: center;
}

.kling-change-btn {
  background: rgba(255,255,255,0.9);
  color: #333;
  border: none;
  padding: 8px 20px;
  border-radius: 20px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.kling-change-btn:hover {
  background: white;
}

.kling-settings {
  background: #f9f9f9;
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 30px;
}

.kling-setting-group {
  margin-bottom: 20px;
}

.kling-setting-group:last-child {
  margin-bottom: 0;
}

.kling-setting-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
}

.kling-setting-group select, 
.kling-setting-group textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
}

.kling-setting-group textarea {
  min-height: 100px;
  resize: vertical;
}

.kling-setting-group input[type="range"] {
  width: 100%;
  margin: 10px 0;
}

#lengthValue {
  display: block;
  text-align: center;
  font-weight: 600;
  color: #6d28d9;
}

.kling-action-btns {
  text-align: center;
  margin-bottom: 40px;
}

.kling-generate-btn {
  background: #6d28d9;
  color: white;
  border: none;
  padding: 15px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.kling-generate-btn:hover {
  background: #5b21b6;
}

.kling-results {
  margin-top: 40px;
}

.kling-results h3 {
  font-size: 1.5rem;
  margin-bottom: 20px;
  text-align: center;
}

.kling-video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.kling-video-item {
  background: #f9f9f9;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.kling-video-item video {
  width: 100%;
  display: block;
}

.kling-video-actions {
  padding: 15px;
  display: flex;
  justify-content: space-between;
}

.kling-download-btn {
  background: #6d28d9;
  color: white;
  border: none;
  padding: 8px 15px;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.kling-download-btn:hover {
  background: #5b21b6;
}

/* Text to video mode styles */
.text-to-video-mode #uploadBox {
  display: none;
}

.text-to-video-mode #promptGroup {
  margin-top: 30px;
}

/* Loading state */
.kling-loading {
  text-align: center;
  padding: 40px;
}

.kling-spinner {
  border: 4px solid rgba(109, 40, 217, 0.2);
  border-radius: 50%;
  border-top: 4px solid #6d28d9;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Responsive styles */
@media (max-width: 768px) {
  .kling-header h1 {
    font-size: 2rem;
  }
  
  .kling-upload-box {
    padding: 30px 20px;
  }
  
  .kling-video-grid {
    grid-template-columns: 1fr;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // DOM elements
  const uploadBox = document.getElementById('uploadBox');
  const previewBox = document.getElementById('previewBox');
  const imageUpload = document.getElementById('imageUpload');
  const uploadBtn = document.getElementById('uploadBtn');
  const changeImageBtn = document.getElementById('changeImageBtn');
  const imagePreview = document.getElementById('imagePreview');
  const videoLength = document.getElementById('videoLength');
  const lengthValue = document.getElementById('lengthValue');
  const generateBtn = document.getElementById('generateBtn');
  const resultsSection = document.getElementById('resultsSection');
  const videoGrid = document.getElementById('videoGrid');
  const modeBtns = document.querySelectorAll('.kling-mode-btn');
  
  // Mode switching
  modeBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      modeBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      
      if (this.dataset.mode === 'text-to-video') {
        document.querySelector('.kling-main').classList.add('text-to-video-mode');
      } else {
        document.querySelector('.kling-main').classList.remove('text-to-video-mode');
      }
    });
  });
  
  // Update length value display
  videoLength.addEventListener('input', function() {
    lengthValue.textContent = this.value + 's';
  });
  
  // Handle image upload
  uploadBtn.addEventListener('click', function() {
    imageUpload.click();
  });
  
  changeImageBtn.addEventListener('click', function() {
    imageUpload.click();
  });
  
  imageUpload.addEventListener('change', function(e) {
    if (e.target.files.length > 0) {
      const file = e.target.files[0];
      const reader = new FileReader();
      
      reader.onload = function(event) {
        imagePreview.src = event.target.result;
        uploadBox.style.display = 'none';
        previewBox.style.display = 'block';
      };
      
      reader.readAsDataURL(file);
    }
  });
  
  // Drag and drop functionality
  uploadBox.addEventListener('dragover', function(e) {
    e.preventDefault();
    this.style.borderColor = '#6d28d9';
    this.style.background = '#f5f0ff';
  });
  
  uploadBox.addEventListener('dragleave', function(e) {
    e.preventDefault();
    this.style.borderColor = '#ccc';
    this.style.background = '#f9f9f9';
  });
  
  uploadBox.addEventListener('drop', function(e) {
    e.preventDefault();
    this.style.borderColor = '#ccc';
    this.style.background = '#f9f9f9';
    
    if (e.dataTransfer.files.length > 0) {
      const file = e.dataTransfer.files[0];
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        
        reader.onload = function(event) {
          imagePreview.src = event.target.result;
          uploadBox.style.display = 'none';
          previewBox.style.display = 'block';
        };
        
        reader.readAsDataURL(file);
      } else {
        alert('Please upload an image file.');
      }
    }
  });
  
  // Generate video function
  generateBtn.addEventListener('click', function() {
    const mode = document.querySelector('.kling-mode-btn.active').dataset.mode;
    const videoStyle = document.getElementById('videoStyle').value;
    const length = videoLength.value;
    const prompt = document.getElementById('videoPrompt').value;
    
    if (mode === 'image-to-video' && !imagePreview.src) {
      alert('Please upload an image first.');
      return;
    }
    
    if (mode === 'text-to-video' && !prompt.trim()) {
      alert('Please enter a prompt for text-to-video generation.');
      return;
    }
    
    // Show loading state
    this.disabled = true;
    this.textContent = 'Generating...';
    
    // In a real implementation, you would call your API here
    // For demo purposes, we'll simulate API call with setTimeout
    setTimeout(() => {
      // Simulate successful generation
      this.disabled = false;
      this.textContent = 'Generate Video';
      
      // Show results section
      resultsSection.style.display = 'block';
      
      // Clear previous results
      videoGrid.innerHTML = '';
      
      // Add sample generated videos (in a real app, these would come from your API)
      for (let i = 0; i < 3; i++) {
        const videoItem = document.createElement('div');
        videoItem.className = 'kling-video-item';
        
        // For demo, we'll use placeholder video
        // In a real implementation, you would use the actual generated video URL
        videoItem.innerHTML = `
          <video controls>
            <source src="https://sample-videos.com/video123/mp4/720/sample_video_720mp4_1mb.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          <div class="kling-video-actions">
            <span>Version ${i+1}</span>
            <button class="kling-download-btn">Download</button>
          </div>
        `;
        
        videoGrid.appendChild(videoItem);
      }
      
      // Scroll to results
      resultsSection.scrollIntoView({ behavior: 'smooth' });
    }, 3000);
  });
  
  // Handle download buttons (delegated event since buttons are dynamically added)
  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('kling-download-btn')) {
      alert('Download functionality would be implemented here.');
      // In a real implementation, you would trigger the download of the video
    }
  });
});
</script>
</body>
</html>
