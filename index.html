<body>
    
<div class="kling-container">
  <div class="kling-header">
    <h1>Image to Video Generator</h1>
    <p>Transform your images into stunning videos with AI</p>
  </div>
  
  <div class="kling-main">
    <div class="kling-mode-selector">
      <button class="kling-mode-btn active" data-mode="image-to-video">Image to Video</button>
      <button class="kling-mode-btn" data-mode="text-to-video">Text to Video</button>
    </div>
    
    <div class="kling-upload-section">
      <div class="kling-upload-box" id="uploadBox">
        <div class="kling-upload-content">
          <svg class="kling-upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 10V9C7 6.23858 9.23858 4 12 4C14.7614 4 17 6.23858 17 9V10C19.2091 10 21 11.7909 21 14C21 15.4806 20.1956 16.8084 19 17.5M7 10C4.79086 10 3 11.7909 3 14C3 15.4806 3.8044 16.8084 5 17.5M7 10C7.43285 10 7.84965 10.0688 8.24006 10.1959M12 12V21M12 12L15 15M12 12L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h3>Upload Image</h3>
          <p>Drag & drop your image here or click to browse</p>
          <input type="file" id="imageUpload" accept="image/*" style="display: none;">
          <button class="kling-upload-btn" id="uploadBtn">Select Image</button>
        </div>
      </div>
      
      <div class="kling-preview-box" id="previewBox" style="display: none;">
        <img id="imagePreview" src="" alt="Preview">
        <div class="kling-preview-overlay">
          <button class="kling-change-btn" id="changeImageBtn">Change Image</button>
        </div>
      </div>
    </div>
    
    <div class="kling-settings">
      <div class="kling-setting-group">
        <label for="videoStyle">Video Style</label>
        <select id="videoStyle">
          <option value="realistic">Realistic</option>
          <option value="animated">Animated</option>
          <option value="cartoon">Cartoon</option>
          <option value="cinematic">Cinematic</option>
        </select>
      </div>
      
      <div class="kling-setting-group">
        <label for="videoLength">Video Length (seconds)</label>
        <input type="range" id="videoLength" min="1" max="30" value="5">
        <span id="lengthValue">5s</span>
      </div>
      
      <div class="kling-setting-group" id="promptGroup">
        <label for="videoPrompt">Prompt (optional)</label>
        <textarea id="videoPrompt" placeholder="Describe what you want to see in the video..."></textarea>
      </div>
    </div>
    
    <div class="kling-action-btns">
      <button class="kling-generate-btn" id="generateBtn">Generate Video</button>
    </div>
  </div>
  
  <div class="kling-results" id="resultsSection" style="display: none;">
    <h3>Generated Videos</h3>
    <div class="kling-video-grid" id="videoGrid">
      <!-- Videos will appear here -->
    </div>
  </div>
</div>

<style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // [Previous DOM elements and event listeners remain the same until generateBtn click handler]
  
  // Generate video function - THIS IS THE UPDATED VERSION
  generateBtn.addEventListener('click', function() {
    const mode = document.querySelector('.kling-mode-btn.active').dataset.mode;
    const videoStyle = document.getElementById('videoStyle').value;
    const length = videoLength.value;
    const prompt = document.getElementById('videoPrompt').value;
    
    if (mode === 'image-to-video' && !imagePreview.src) {
      alert('Please upload an image first.');
      return;
    }
    
    if (mode === 'text-to-video' && !prompt.trim()) {
      alert('Please enter a prompt for text-to-video generation.');
      return;
    }
    
    // Show loading state
    this.disabled = true;
    this.textContent = 'Generating...';
    
    // Create a canvas to generate video frames from the image
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = imagePreview.src;
    
    img.onload = function() {
      canvas.width = img.width;
      canvas.height = img.height;
      
      // In a real implementation, you would call your API here
      // For demo purposes, we'll simulate video generation
      setTimeout(() => {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate Video';
        
        // Show results section
        resultsSection.style.display = 'block';
        videoGrid.innerHTML = '';
        
        // Generate 3 sample videos (in a real app, these would come from your API)
        for (let i = 0; i < 3; i++) {
          const videoItem = document.createElement('div');
          videoItem.className = 'kling-video-item';
          
          // Create a video element with simulated animation
          const video = document.createElement('video');
          video.controls = true;
          video.style.width = '100%';
          
          // Create a blob URL for our generated video
          const blob = generateVideoFromImage(img, length, i);
          const videoUrl = URL.createObjectURL(blob);
          
          videoItem.innerHTML = `
            <video controls>
              <source src="${videoUrl}" type="video/mp4">
              Your browser does not support the video tag.
            </video>
            <div class="kling-video-actions">
              <span>Version ${i+1}</span>
              <button class="kling-download-btn" data-video="${videoUrl}">Download</button>
            </div>
          `;
          
          videoGrid.appendChild(videoItem);
        }
        
        resultsSection.scrollIntoView({ behavior: 'smooth' });
      }, 2000);
    };
  });
  
  // Function to generate a simulated video from the image
  function generateVideoFromImage(img, duration, version) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    
    // Create a stream to write our video frames to
    const stream = canvas.captureStream(30);
    const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
    const chunks = [];
    
    mediaRecorder.ondataavailable = function(e) {
      chunks.push(e.data);
    };
    
    mediaRecorder.start();
    
    // Record for the specified duration (in seconds)
    const startTime = Date.now();
    const endTime = startTime + (duration * 1000);
    
    // Create different animation effects based on version number
    function drawFrame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      
      const currentTime = Date.now();
      const progress = (currentTime - startTime) / (endTime - startTime);
      
      // Apply different effects based on version
      if (version === 0) {
        // Zoom in effect
        const zoom = 1 + (progress * 0.5);
        ctx.setTransform(zoom, 0, 0, zoom, 
                        canvas.width/2 * (1 - zoom), 
                        canvas.height/2 * (1 - zoom));
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      } 
      else if (version === 1) {
        // Pan left effect
        const offset = progress * canvas.width * 0.5;
        ctx.drawImage(img, -offset, 0, canvas.width, canvas.height);
      } 
      else {
        // Color fade effect
        ctx.globalAlpha = 1 - (progress * 0.5);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
      }
      
      if (currentTime < endTime) {
        requestAnimationFrame(drawFrame);
      } else {
        mediaRecorder.stop();
      }
    }
    
    drawFrame();
    
    // Return a promise that resolves with the video blob
    return new Promise(resolve => {
      mediaRecorder.onstop = function() {
        const blob = new Blob(chunks, { type: 'video/webm' });
        resolve(blob);
      };
    });
  }
  
  // Handle download buttons
  document.addEventListener('click', async function(e) {
    if (e.target.classList.contains('kling-download-btn')) {
      const videoUrl = e.target.dataset.video;
      
      // In our case, we need to generate the video when downloading
      // since we're not storing it permanently
      const videoItem = e.target.closest('.kling-video-item');
      const video = videoItem.querySelector('video');
      const duration = videoLength.value;
      
      // Show loading for download
      e.target.textContent = 'Preparing...';
      e.target.disabled = true;
      
      // Get the image
      const img = new Image();
      img.src = imagePreview.src;
      
      await img.decode();
      
      // Generate the video
      const version = parseInt(videoItem.querySelector('span').textContent.replace('Version ', '')) - 1;
      const blob = await generateVideoFromImage(img, duration, version);
      const url = URL.createObjectURL(blob);
      
      // Create download link
      const a = document.createElement('a');
      a.href = url;
      a.download = `generated-video-${new Date().getTime()}.mp4`;
      document.body.appendChild(a);
      a.click();
      
      // Clean up
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
      
      e.target.textContent = 'Download';
      e.target.disabled = false;
    }
  });
});
</script>
